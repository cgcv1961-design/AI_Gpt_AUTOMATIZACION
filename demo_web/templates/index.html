<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Analizador Contractual IA - Con Analisis Deterministico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 40px auto;
            padding: 20px;
        }
        .box {
            border: 1px solid #ccc;
            padding: 24px;
            border-radius: 10px;
        }
        h1 {
            margin-top: 0;
        }
        button {
            margin-top: 16px;
            padding: 10px 18px;
            cursor: pointer;
        }
        .nota {
            color: #555;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Analizador Contractual IA - Con Analisis Deterministico</h1>
        <p>
            Sube un contrato para generar un análisis automático
            y descargar el resultado en JSON y Word.
        </p>

        <form action="/analizar" method="post" enctype="multipart/form-data">
            <input type="file" name="archivo" required>
            <br>
            <button type="submit">Analizar contrato</button>
        </form>

        <p class="nota">
            Formatos recomendados: PDF, TXT, DOCX, ODT.
        </p>
    </div>
</body>
</html>
